name: Benchmarks

# Runs the three suites in benchmarks/README.md and builds RESULTS.md from
# them. The results go to the run summary and an artifact; a pull request
# brings them into the repository.
on:
  workflow_dispatch:
    inputs:
      businesstimedelta-batch:
        description: Also run businesstimedelta on 1,000,000 pairs (about half an hour)
        type: boolean
        default: false
  # Not `release: published`: release.yml creates the release with
  # GITHUB_TOKEN, and events from that token start no workflows.
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"
          enable-cache: false

      - run: cargo bench -p workclock --locked --bench workclock
      - run: uv sync --locked
      # A tag push has no inputs, so SLOW_BATCH is empty there.
      - name: Python suite
        env:
          SLOW_BATCH: ${{ inputs.businesstimedelta-batch }}
        run: |
          if [ "$SLOW_BATCH" = true ]; then
            uv run pytest benchmarks/python --benchmark-json=python.json
          else
            uv run pytest benchmarks/python --benchmark-json=python.json \
              -k "not (test_batch and businesstimedelta)"
          fi
      - name: JavaScript suite
        working-directory: js
        run: |
          npm ci
          npm run build:node
          node bench/bench.js ../js.json
      - run: uv run python benchmarks/report.py python.json js.json > RESULTS.md
      - run: cat RESULTS.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-results
          path: |
            RESULTS.md
            python.json
            js.json
            target/criterion
