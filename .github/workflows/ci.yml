name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings -W clippy::pedantic

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked --all-features

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov -p workclock --locked --all-features --lcov --output-path lcov.info
      - run: |
          {
            echo '```text'
            cargo llvm-cov report -p workclock
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
      # The gate runs last so the summary and artifact exist when it fails.
      - run: cargo llvm-cov report -p workclock --fail-under-lines 90

  # Counts instructions under Valgrind (benchmarks/README.md). On a pull
  # request, base and head run in this one job with one toolchain, and more
  # than 3% extra instructions in `single` or `year` fails it.
  instructions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GUNGRAUN_COLOR: never
    # An explicit shell adds pipefail, so `| tee` keeps a failing exit status.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The runner refuses a gungraun of any other version than its own, and
      # a pull request may change that version, so base and head each get the
      # runner their Cargo.lock asks for.
      - name: Install gungraun-runner
        id: runner
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          for side in head ${BASE:+base}; do
            if [ "$side" = base ]; then rev="$BASE"; else rev="$GITHUB_SHA"; fi
            version="$(git show "$rev:Cargo.lock" | awk '/^name = "gungraun"$/ {getline; gsub(/"/, "", $3); v = $3} END {print v}')"
            if [ -z "$version" ]; then continue; fi
            root="$RUNNER_TEMP/gungraun-runner-$version"
            cargo install --locked --version "$version" --root "$root" gungraun-runner
            echo "$side=$root/bin/gungraun-runner" >> "$GITHUB_OUTPUT"
          done
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Count the base
        id: base
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GUNGRAUN_RUNNER: ${{ steps.runner.outputs.base }}
        run: |
          trap 'git checkout --quiet "$GITHUB_SHA"' EXIT
          git checkout --quiet "$BASE"
          if [ -f crates/workclock/benches/instructions.rs ] && [ -f benchmarks/python/count.py ]; then
            cargo bench -p workclock --locked --bench instructions -- --save-baseline=base
            uv sync --locked
            uv run python benchmarks/python/count.py "$RUNNER_TEMP/base.json"
            echo "compare=true" >> "$GITHUB_OUTPUT"
          else
            echo "The base has no instruction counts, so only the head is counted."
          fi
      - name: Count the head in Rust
        env:
          COMPARE: ${{ steps.base.outputs.compare }}
          GUNGRAUN_RUNNER: ${{ steps.runner.outputs.head }}
        run: |
          if [ "$COMPARE" = true ]; then
            cargo bench -p workclock --locked --bench instructions -- --baseline=base | tee "$RUNNER_TEMP/rust.txt"
          else
            cargo bench -p workclock --locked --bench instructions | tee "$RUNNER_TEMP/rust.txt"
          fi
      - name: Count the head in Python
        if: ${{ !cancelled() }}
        env:
          COMPARE: ${{ steps.base.outputs.compare }}
        run: |
          uv sync --locked
          uv run python benchmarks/python/count.py "$RUNNER_TEMP/head.json" | tee "$RUNNER_TEMP/python.txt"
          if [ "$COMPARE" = true ]; then
            uv run python benchmarks/compare_instructions.py "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" | tee "$RUNNER_TEMP/python.md"
          fi
      - name: Summary
        if: always()
        run: |
          {
            echo "### Rust"
            if [ -s "$RUNNER_TEMP/rust.txt" ]; then
              echo '```text'
              cat "$RUNNER_TEMP/rust.txt"
              echo '```'
            else
              echo "Not counted."
            fi
            echo "### Python"
            if [ -s "$RUNNER_TEMP/python.md" ]; then
              cat "$RUNNER_TEMP/python.md"
            elif [ -s "$RUNNER_TEMP/python.txt" ]; then
              echo '```text'
              cat "$RUNNER_TEMP/python.txt"
              echo '```'
            else
              echo "Not counted."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --locked --no-deps --all-features

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check -p workclock --locked --all-features

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny
      - run: cargo deny check

  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # Checks that the extension's stub matches the compiled module.
      - run: uv run python -m mypy.stubtest workclock._workclock

  python-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: uv sync --locked
      - run: uv run pytest
      # Reuses the extension that `uv sync` compiled.
      - run: uv build --wheel --out-dir dist
      - name: Install the wheel into fresh environments
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          root="$(pwd -W 2>/dev/null || pwd)"
          wheel="$(ls "$root"/dist/*.whl)"
          expected="$(awk -F'"' '/^\[workspace.package\]/ {f = 1; next} /^\[/ {f = 0} f && /^version/ {print $2; exit}' Cargo.toml)"
          mkdir -p "$RUNNER_TEMP/fresh" "$RUNNER_TEMP/pip-check"

          cd "$RUNNER_TEMP/fresh"
          uv init --bare --python "$PYTHON" fresh-project
          cd fresh-project
          uv add "$wheel"
          test "$(uv run python -c 'import workclock; print(workclock.__version__)')" = "$expected"

          cd "$RUNNER_TEMP/pip-check"
          uv venv --python "$PYTHON"
          uv pip install "$wheel"
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          test "$(python -c 'import workclock; print(workclock.__version__)')" = "$expected"

  wasm:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm pack
      - run: ../.github/scripts/npm-install-check.sh workclock-*.tgz

  # Builds the website against the package in js/ and checks it, without
  # deploying, so a broken site fails the pull request instead of the deploy.
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm run build:web
        working-directory: js
      - run: npm ci
        working-directory: website
      - run: npm run types:check
        working-directory: website
      - run: npm run build
        working-directory: website
      - run: npm run check:agents
        working-directory: website
      - run: npx playwright install --with-deps chromium
        working-directory: website
      - run: npm run test:a11y
        working-directory: website
      # lychee resolves root-relative links against out/, and the site's
      # own absolute URLs against the built files. It skips Next.js'
      # __next.*.txt prefetch files, which repeat each page's links, and goes
      # slowly enough that github.com does not answer 503. It skips the
      # CHANGELOG's release links, which exist only once the tag is pushed,
      # and npmjs.com, which answers automated requests with 403.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --max-retries 5
            --retry-wait-time 10
            --exclude-path '/__next\.'
            --root-dir ${{ github.workspace }}/website/out
            --index-files index.html
            --remap 'https://workclock\.karthik\.nz/(.*) file://${{ github.workspace }}/website/out/$1'
            --exclude '^https://(claude\.ai|chatgpt\.com|www\.npmjs\.com)/'
            --exclude '^https://github\.com/Karthik-beta/workclock/(compare|releases/tag)/'
            'website/out/**/*.html' 'website/out/**/*.md' 'website/out/**/*.txt'
          fail: true

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commit subjects follow Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='((feat|fix|docs|test|refactor|perf|build|ci|chore|style|revert)(\([^()]+\))?!?: [^ ]|Revert ")'
          log="$(git log --format='%h %s' "$BASE..$HEAD")"
          echo "Checking $(git rev-list --count "$BASE..$HEAD") commits in $BASE..$HEAD"
          bad="$(grep -vE "^[0-9a-f]+ ($pattern)" <<< "$log" || true)"
          if [ -n "$bad" ]; then
            echo "::error::These commits do not follow Conventional Commits (see CONTRIBUTING.md):"
            echo "$bad"
            echo "A merge commit from updating the branch fails too; rebase instead."
            exit 1
          fi

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: zizmor@1.31.1
      # Online audits look up the pinned actions, e.g. for known vulnerabilities.
      - run: zizmor --format github .github/
        env:
          GH_TOKEN: ${{ github.token }}
      # actionlint runs shellcheck, which the runner image provides, on every
      # `run` script.
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  # Single status check for branch protection, so adding a job never
  # requires editing the protection rule.
  ci-ok:
    if: ${{ !cancelled() }}
    needs: [fmt, clippy, test, coverage, instructions, docs, msrv, deny, python-lint, python-test, wasm, website, commits, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
