name: Release

# A `v*` tag publishes to TestPyPI, then to PyPI, npm and crates.io. Running
# the workflow by hand is the dry run: it builds and checks every package and
# publishes to TestPyPI only. Pull requests that change packaging build and
# check the packages without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/install-check.sh
      - Cargo.toml
      - crates/*/Cargo.toml
      - pyproject.toml
      - js/package.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          version="$(awk -F'"' '/^\[workspace.package\]/ {f = 1; next} /^\[/ {f = 0} f && /^version/ {print $2; exit}' Cargo.toml)"
          npm_version="$(jq -r .version js/package.json)"
          if [ "$npm_version" != "$version" ]; then
            echo "::error::js/package.json has $npm_version, Cargo.toml has $version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, check: true }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64, check: true }
          - { os: windows-latest, target: x64, check: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - if: matrix.check
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - if: matrix.check
        shell: bash
        run: |
          uv venv --python 3.9
          uv pip install --no-index --find-links dist workclock
          uv run --no-project python -c 'import workclock; print(workclock.__version__)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build and import from the sdist
        run: |
          uv venv --python 3.13
          uv pip install dist/*.tar.gz
          uv run --no-project python -c 'import workclock; print(workclock.__version__)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdist
          path: dist

  npm-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --dry-run
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: js/workclock-*.tgz

  crate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: The crate's license matches the repository's
        run: cmp LICENSE crates/workclock/LICENSE
      - run: cargo publish -p workclock --dry-run

  testpypi:
    if: github.event_name != 'pull_request'
    needs: [version, wheels, sdist, npm-package, crate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: testpypi
      url: https://test.pypi.org/project/workclock/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # A dry run may already have uploaded this version.
          skip-existing: true

  testpypi-install:
    needs: [version, testpypi]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - shell: bash
        run: .github/scripts/install-check.sh https://test.pypi.org/simple/ "${{ needs.version.outputs.version }}"

  pypi:
    if: github.ref_type == 'tag'
    needs: [version, testpypi-install]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/workclock/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm:
    if: github.ref_type == 'tag'
    needs: [version, testpypi-install]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/workclock/v/${{ needs.version.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm publish workclock-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  crates-io:
    if: github.ref_type == 'tag'
    needs: [version, testpypi-install]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/workclock/${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo publish -p workclock
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  pypi-install:
    needs: [version, pypi]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - shell: bash
        run: .github/scripts/install-check.sh https://pypi.org/simple/ "${{ needs.version.outputs.version }}"
