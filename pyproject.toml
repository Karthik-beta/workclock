[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "workclock"
description = "Fast, correct business-time arithmetic: working hours, SLAs and shifts"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Karthik P" }]
keywords = ["business-hours", "working-hours", "sla", "timezone", "shift"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Scheduling",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/Karthik-beta/workclock"
Issues = "https://github.com/Karthik-beta/workclock/issues"
Changelog = "https://github.com/Karthik-beta/workclock/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "businesstimedelta==1.0.1",
    "holidays",
    "mypy",
    "pytest",
    "pytz",
    "ruff",
]

[tool.maturin]
manifest-path = "crates/workclock-py/Cargo.toml"
module-name = "workclock._workclock"
python-source = "python"

[tool.uv]
# uv only rebuilds the extension when one of these changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ANN", "PT", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["python", "tests/python"]

[[tool.mypy.overrides]]
# Neither ships type information; types-pytz would be another dependency.
module = ["businesstimedelta.*", "pytz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = ["--import-mode=importlib"]
